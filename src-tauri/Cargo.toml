[package]
name = "grillme"
version = "0.1.0"
description = "A hands-on study workspace"
authors = ["Grill Me"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "grillme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-opener = "=2.7.2"
